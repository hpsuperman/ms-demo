server:
  port: {{port}}

spring:
  profiles:
    # 默认 dev 环境；生产用 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: dev
  application:
    # 服务名：注册到 Nacos 的名字，网关和其他服务靠这个名字找到它
    name: {{serviceName}}
  cloud:
    nacos:
      # 公共地址：注册中心(discovery) 和 配置中心(config) 共用
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        encode: UTF-8
  config:
    # 从 Nacos 配置中心拉取：{{serviceName}}.yaml（共享）+ {{serviceName}}-dev.yaml（dev 环境）
    # optional: 前缀表示 Nacos 里缺 dataId 也不报错
    import:
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml
  flyway:
    # 关键：共用 ms_demo 库，history 表必须独立，避免版本号冲突
    table: {{flywayTable}}
    baseline-on-migrate: true
    clean-disabled: true

# 环境相关配置（datasource / redis / mybatis-plus）
# 已迁到 Nacos 配置中心：dataId = {{serviceName}}.yaml 与 {{serviceName}}-dev.yaml（group=DEFAULT_GROUP）
# 本地不重复配置；Nacos 未就绪或缺 dataId 时服务无法启动（配置中心优先的设计）

management:
  endpoints:
    web:
      exposure:
        include: health,info