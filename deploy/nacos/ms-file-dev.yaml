# ms-file 开发环境配置（Nacos 配置中心 dataId：ms-file-dev.yaml，group=DEFAULT_GROUP）
# 同步源：本文件 deploy/nacos/ms-file-dev.yaml
# 敏感值一律 ${} 占位，由本机环境变量注入，不写死
spring:
  servlet:
    multipart:
      # 上传大小限制，超限由 ms-common 的 GlobalExceptionHandler 兜底
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ms-file
