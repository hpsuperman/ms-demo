server:
  port: 3083

spring:
  profiles:
    # 默认 dev 环境；生产用 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: dev
  application:
    name: ms-file
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  servlet:
    multipart:
      # 上传大小限制，超限由 ms-common 的 GlobalExceptionHandler 兜底（FILE_UPLOAD_FAILED）
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ms-file
