server:
  port: 3082

spring:
  profiles:
    # 默认 dev 环境；生产用 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: dev
  application:
    name: ms-order
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    # 所有服务共用一个库 ms_demo
    url: ${DB_URL:jdbc:mysql://localhost:3306/ms_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    # 数据库迁移：SQL 写 src/main/resources/db/migration/，命名 V<版本>__<描述>.sql
    table: flyway_order_history   # 关键：共用 ms_demo 库，history 表必须独立，避免版本号冲突
    baseline-on-migrate: true    # 已存在的库/表不报错，允许基线
    check-location: true
    validate-on-migrate: true
    clean-disabled: true         # 禁止 clean 删库

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
