server:
  port: 3080

spring:
  profiles:
    # 默认 dev 环境；生产用 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: dev
  application:
    name: ms-gateway
  cloud:
    nacos:
      # 公共地址：注册中心(discovery) 和 配置中心(config) 共用
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      # 浏览器(web)访问放开跨域，否则 chrome 里登录请求会被 CORS 拦截
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        # 规则：路径以 /user/ 开头 → 转发到 ms-user 服务
        - id: ms-user
          uri: lb://ms-user
          predicates:
            - Path=/user/**
        # 路径以 /file/ 开头 → 转发到 ms-file 服务（MinIO 上传下载）
        - id: ms-file
          uri: lb://ms-file
          predicates:
            - Path=/file/**

        # 路径以 /leave/ 开头 → 转发到 ms-approval 服务
        - id: ms-approval
          uri: lb://ms-approval
          predicates:
            - Path=/leave/**
        # 路径以 /order/ 开头 → 转发到 ms-order 服务
        - id: ms-order
          uri: lb://ms-order
          predicates:
            - Path=/order/**
  config:
    # 从 Nacos 配置中心拉取：ms-gateway.yaml（共享）+ ms-gateway-dev.yaml（dev 环境）
    # optional: 前缀表示 Nacos 里缺 dataId 也不报错
    import:
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 网关统一 JWT 鉴权：jwt.secret 与 ms-user 共用同一密钥
# whitelist = 免鉴权路径（登录/注册/验证码 + 健康检查）；其余路径都必须带 Bearer token
jwt:
  secret: ${JWT_SECRET}
gateway:
  auth:
    whitelist:
      - /user/captcha
      - /user/register
      - /user/login
      - /actuator/health
